<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心情與食品安全 AI 助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="chat-app">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark">食</span>
            <div>
                <strong>食品安全 AI</strong>
                <small>心情陪伴與食品安全工具</small>
            </div>
        </div>
        <nav class="nav" aria-label="主要功能">
            <ul>
                <li class="nav-item active"><a href="{{ url_for('home') }}">AI 對話</a></li>
                <li class="nav-item"><a href="{{ url_for('food_label_page') }}">食品標示分析</a></li>
                <li class="nav-item"><a href="{{ url_for('food_safety_knowledge_page') }}">食品安全知識</a></li>
                <li class="nav-item"><a href="#">設定</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="chat-header">
            <div>
                <p class="eyebrow">Mind and Food Safety Assistant</p>
                <h1>心情與食品安全 AI 助手</h1>
            </div>
            <div class="status-panel">
                <span class="status-badge">待命中</span>
            </div>
        </header>

        <section class="chat-messages" id="chat-messages" aria-live="polite">
            <div class="chat-message chat-message--ai">
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <p>你好，我可以陪你聊天，也可以回答食品安全與營養標示相關問題。如果要上傳食品成分表圖片，請點左側「食品標示分析」。</p>
                    <div class="message-meta">
                        <time class="message-time">現在</time>
                    </div>
                </div>
            </div>
        </section>

        <footer class="chat-form">
            <form id="chat-form">
                <input type="text" class="chat-input" id="chat-input" placeholder="輸入你的問題，例如：反式脂肪為什麼不健康？" required>
                <button type="submit" class="chat-submit">送出</button>
            </form>
        </footer>
    </main>

    <aside class="info-panel">
        <div class="info-section">
            <h3>情緒分析</h3>
            <div class="sentiment-display">
                <span class="sentiment-badge">尚未分析</span>
                <span class="sentiment-score">分數: --</span>
            </div>
        </div>

        <div class="info-section">
            <h3>關鍵主題</h3>
            <ul class="keyword-list">
                <li>食品營養標示</li>
                <li>糖、鈉與脂肪</li>
                <li>食品添加物</li>
            </ul>
        </div>
        <div class="info-section">
            <h3>建議提問</h3>
            <ul class="suggestion-list">
                <li>如何判斷一項食品是否太甜？</li>
                <li>鈉含量高會對身體有什麼影響？</li>
                <li>反式脂肪為什麼比較不健康？</li>
            </ul>
        </div>
    </aside>
</div>

<script src="{{ url_for('static', filename='js/chat.js') }}" defer></script>

</body>
</html>
