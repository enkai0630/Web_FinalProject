services:
  - type: web
    name: web-finalproject
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: AZURE_LANGUAGE_KEY
        sync: false
      - key: AZURE_LANGUAGE_ENDPOINT
        sync: false
      - key: AZURE_VISION_KEY
        sync: false
      - key: AZURE_VISION_ENDPOINT
        sync: false
